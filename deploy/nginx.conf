# /etc/nginx/sites-available/strategy-lab
# Replace demo.tglevels.com with your subdomain. Certbot adds the HTTPS
# (listen 443 / ssl_certificate) lines to this file for you.

server {
    listen 80;
    server_name demo.tglevels.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip on;
        gzip_types application/json text/csv application/javascript text/css;
    }

    # The TradingView library is large and versioned: let browsers cache it.
    location /charting_library/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        gzip on;
        gzip_types application/javascript text/css;
    }

    # Live mode streams candles; don't buffer or time it out.
    location /api/live {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
